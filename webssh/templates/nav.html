{% if signed_in_user %}
<div class="signed-in">
  <form id="signout" action="{{ signout_url }}" method="post">
    {{ signed_in_user.fullname }}
    &middot; <a href="{{ profile_url }}">My profile</a>
    {% if signed_in_user.is_administrator %}
    &middot; <a href="{{ users_url }}">Users</a>
    {% end %}
    &middot;
    {% module xsrf_form_html() %}
    <button type="submit" class="btn btn-link">Sign out</button>
  </form>
</div>
{% end %}
