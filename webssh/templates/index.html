<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title> WebSSH </title>
    <link href="static/img/favicon.png" rel="icon" type="image/png">
    <link href="static/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <link href="static/css/xterm.min.css" rel="stylesheet" type="text/css"/>
    <link href="static/css/fullscreen.min.css" rel="stylesheet" type="text/css"/>
    <style>
      .row {
        margin-top: 15px;
        margin-bottom: 10px;
      }

      .container {
        margin-top: 20px;
      }

      .btn {
        margin-top: 15px;
      }

      .btn-danger {
        margin-left: 5px;
      }

      #connection-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 24px;
        padding: 0 10px;
        z-index: 256;
        display: none;
        align-items: center;
        justify-content: space-between;
        background: #222;
        color: #8fdf8f;
        font-family: monospace;
        font-size: 13px;
      }

      #connection-bar .btn {
        margin: 0;
        padding: 0 6px;
        font-size: 12px;
        line-height: 18px;
      }

      .password-toggle.btn {
        margin-top: 0;
        display: flex;
        align-items: center;
      }

      .password-toggle .icon-hide,
      .password-toggle[aria-pressed="true"] .icon-show {
        display: none;
      }

      .password-toggle[aria-pressed="true"] .icon-hide {
        display: inline;
      }

      body.connected #connection-bar {
        display: flex;
      }

      body.connected .xterm.fullscreen {
        top: 24px;
      }

      {% include nav-style.html %}
      {% if font.family %}
      @font-face {
        font-family: '{{ font.family }}';
        src: url('{{ font.url }}');
      }

      body {
        font-family: '{{ font.family }}';
      }
      {% end %}
    </style>
  </head>
  <body>
    <div id="waiter" style="display: none"> Connecting ... </div>

    <div id="connection-bar">
      <span id="connection-target"></span>
      <button type="button" id="disconnect" class="btn btn-outline-light">Disconnect</button>
    </div>

    <div class="container form-container" style="display: none">
      {% include nav.html %}
      {% if saved_hosts %}
      <div id="saved-hosts">
        <label>Saved hosts</label>
        <div>
          {% for host in saved_hosts %}
          <button type="button" class="btn btn-outline-primary btn-sm saved-host" data-saved-host="{{ host.id }}" title="{{ host.username }}@{{ host.hostname }}:{{ host.port }}">{{ host.name }}</button>
          {% end %}
        </div>
      </div>
      {% end %}
      <form id="connect" action="" method="post" enctype="multipart/form-data"{% if signed_in_user %} data-signed-in="yes"{% end %}{% if debug %} novalidate{% end %}>
        <div class="row">
          <div class="col">
            <label for="Hostname">Hostname</label>
            <input class="form-control" type="text" id="hostname" name="hostname" value="" required>
          </div>
          <div class="col">
            <label for="Port">Port</label>
            <input class="form-control" type="number" id="port" name="port" placeholder="22" value="" min=1 max=65535>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="Username">Username</label>
            <input class="form-control" type="text" id="username" name="username" value="" autocomplete="off" readonly required>
          </div>
          <div class="col">
            <label for="Password">Password</label>
            <div class="input-group">
              <input class="form-control" type="password" id="password" name="password" value="" autocomplete="new-password" readonly>
              <div class="input-group-append">
                <button type="button" class="btn btn-outline-secondary password-toggle" data-toggle-password="#password" aria-pressed="false" aria-label="Show password" title="Show password">
                  <svg class="icon-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="icon-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="Username">Private Key</label>
            <input class="form-control" type="file" id="privatekey" name="privatekey" value="">
          </div>
          <div class="col">
            <label for="Passphrase">Passphrase</label>
            <input class="form-control" type="password" id="passphrase" name="passphrase" value="" autocomplete="new-password" readonly>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="totp">Totp (time-based one-time password)</label>
            <input class="form-control" type="password" id="totp" name="totp" value="" autocomplete="one-time-code" readonly>
          </div>
          <div class="col">
            {% if signed_in_user %}
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="save" name="save">
              <label class="form-check-label" for="save">Save as a saved host named</label>
            </div>
            <input class="form-control" type="text" id="name" name="name" value="" autocomplete="off" placeholder="Name">
            {% end %}
          </div>
        </div>
        <input type="hidden" id="term" name="term" value="xterm-256color">
        {% module xsrf_form_html() %}
        <button type="submit" class="btn btn-primary">Connect</button>
        <button type="reset" class="btn btn-danger">Reset</button>
      </form>
    </div>

    <div class="container">
      <div id="status" style="color: red; white-space: pre-line;"></div>
      <div id="terminal"></div>
    </div>

    <script src="static/js/jquery.min.js"></script>
    <script src="static/js/popper.min.js"></script>
    <script src="static/js/bootstrap.min.js"></script>
    <script src="static/js/xterm.min.js"></script>
    <script src="static/js/xterm-addon-fit.min.js"></script>
    <script src="{{ static_url('js/main.js')[1:] }}"></script>
  </body>
</html>
